name: Check market data sources
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: CNBC quotes
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          curl -sS -m 25 -A "$UA" "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=.SPX%7C.DJI%7C.IXIC%7CUS10Y%7CEUR%3D%7C%40LCO.1%7CLCO.1%7C%40CL.1%7C.BRENT&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json" -o /tmp/q.json
          python3 - <<'P'
          import json
          d=json.load(open('/tmp/q.json'))['FormattedQuoteResult']['FormattedQuote']
          for q in d: print({k:q.get(k) for k in ('symbol','code','name','last','change','change_pct','previous_day_closing','last_time','type')})
          P
