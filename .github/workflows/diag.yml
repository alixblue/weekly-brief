name: Check free AI access
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: One test request to GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -i https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with the JSON {\"ok\": true}"}],"response_format":{"type":"json_object"}}' | head -c 1500
