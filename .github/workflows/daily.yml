name: Daily news update
on:
  schedule:
    - cron: "0 5 * * *"   # every day 05:00 UTC (13:00 in Singapore/HK)
  workflow_dispatch: {}    # "Run workflow" button for manual refreshes
  push:
    branches: [main]       # publish design/code changes right away (no news refresh)
permissions:
  contents: write
  pages: write
  id-token: write
  models: read            # free GitHub Models for the summaries
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch, rank, summarise, render
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: Claude writes the summaries
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}       # otherwise GitHub's free models do
        run: python pipeline/update.py all
      - name: Save this week's data
        if: github.event_name != 'push'
        run: |
          git config user.name "weekly-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/archive pipeline/glossary.json site/index.html
          git commit -m "Daily update $(date -u +%F)" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
